{{- /*
runner-vm-secrets: stringData for the runner-vm pod's envFrom.
  DAYTONA_RUNNER_TOKEN is included here only when
  services.runnerVm.existingTokenSecret is unset -- when it IS set, the
  DaemonSet sources DAYTONA_RUNNER_TOKEN directly from that secret via an
  explicit env entry instead, so it is deliberately NOT duplicated here.
*/ -}}
{{- if .Values.services.runnerVm.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "daytona.fullname" . }}-runner-vm-secrets
  namespace: {{ include "daytona.namespace" . }}
  labels:
    {{- include "daytona.labels" . | nindent 4 }}
    app.kubernetes.io/component: runner-vm
type: Opaque
stringData:
  DAYTONA_API_URL: {{ .Values.services.runnerVm.env.DAYTONA_API_URL | default (required "daytonaApiUrl is required" .Values.daytonaApiUrl) | quote }}
  {{- if not .Values.services.runnerVm.existingTokenSecret }}
  DAYTONA_RUNNER_TOKEN: {{ required "services.runnerVm.runnerToken (or existingTokenSecret) is required -- obtain it via POST /runners with sandboxClass set, before installing with runnerVm.enabled=true" .Values.services.runnerVm.runnerToken | quote }}
  {{- end }}
  SSH_PUBLIC_KEY: {{ .Values.services.runnerVm.env.SSH_PUBLIC_KEY | default "" | quote }}
  {{- if eq .Values.services.runnerVm.storage.backend "s3" }}
  # Standard AWS SDK credential env vars, not IGNIUM_STORAGE__ fields -- see
  # the matching comment in runner-vm-configmap.yaml.
  AWS_ACCESS_KEY_ID: {{ .Values.services.runnerVm.storage.s3.accessKey | default "" | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.services.runnerVm.storage.s3.secretKey | default "" | quote }}
  {{- else if eq .Values.services.runnerVm.storage.backend "azure" }}
  IGNIUM_STORAGE__AZURE_CONNECTION_STRING: {{ .Values.services.runnerVm.storage.azure.connectionString | default "" | quote }}
  {{- else if eq .Values.services.runnerVm.storage.backend "oci" }}
  IGNIUM_STORAGE__OCI_USERNAME: {{ .Values.services.runnerVm.storage.oci.username | default "" | quote }}
  IGNIUM_STORAGE__OCI_PASSWORD: {{ .Values.services.runnerVm.storage.oci.password | default "" | quote }}
  {{- end }}
{{- end }}
